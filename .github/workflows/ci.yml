# WHAT THIS CATCHES THAT ci-parity.sh CANNOT, and it is the whole reason to have both: that script
# runs a tracked-files-only export on the developer's machine, and says so - "a Linux runner is not
# macOS". This is the Linux runner. It also tests the OLDEST python the package claims to support,
# which nothing local does; declaring >=3.11 while only ever running 3.14 is an aspiration, not a
# fact.
#
# THE BROWSER CHECK RUNS HERE TOO, on one python. without it the ui layer was never proven by ci:
# tests/test_review_ui_browser.py skips when playwright is not importable, and a green run said
# nothing about tab wiring, pickers or the page's own scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same ref supersedes the older run; the answer is about the branch tip
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: when 3.11 breaks and 3.14 does not, the interesting information is that only
      # one of them broke, which a cancelled sibling job hides
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # docs-only changes skip the toolchain steps below; the job itself still runs and reports,
      # so a required check never stays pending. manifests, workflows and code never count as docs
      - name: detect docs-only change
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          docs_only=false
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$base" "${{ github.sha }}" \
              | grep -v -E '^(docs/.*|[^/]+\.md|LICENSE)$' || true)
            if [ -z "$other" ]; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true

      - name: sync
        if: steps.changes.outputs.docs_only != 'true'
        run: uv sync --dev --python ${{ matrix.python }}

      - name: ruff check
        if: steps.changes.outputs.docs_only != 'true'
        run: uv run ruff check .

      - name: ruff format --check
        if: steps.changes.outputs.docs_only != 'true'
        run: uv run ruff format --check .

      - name: pytest
        if: steps.changes.outputs.docs_only != 'true'
        # two process groups: torch and xgboost/lightgbm cannot share a process (tests/conftest.py)
        run: uv run python scripts/run_tests.py -q

      - name: browser check
        # one python is enough: the page does not change with the interpreter, chromium does the work
        if: matrix.python == '3.14' && steps.changes.outputs.docs_only != 'true'
        run: |
          uv run --with playwright playwright install --with-deps chromium
          uv run --with playwright pytest tests/test_review_ui_browser.py -q -rs

  # the minimal job above skips every test that needs an optional backend; this one installs the
  # forecast extras so those tests run instead of skipping
  test-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect docs-only change
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          docs_only=false
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$base" "${{ github.sha }}" \
              | grep -v -E '^(docs/.*|[^/]+\.md|LICENSE)$' || true)
            if [ -z "$other" ]; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true

      - name: sync with forecast extras
        if: steps.changes.outputs.docs_only != 'true'
        # python 3.12: unverified that every optional wheel (catboost, statsforecast) exists for 3.14
        run: >
          uv sync --dev --python 3.12
          --extra forecast --extra lightgbm --extra stats --extra holidays
          --extra catboost --extra trees

      - name: pytest forecast
        if: steps.changes.outputs.docs_only != 'true'
        run: uv run python scripts/run_tests.py -q
