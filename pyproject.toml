[project]
name = "smolsmort"
version = "0.5.3"
description = "a human-in-the-loop sorting loop: find candidates, judge them, train, predict, judge again"
# 3.11, matching the oldest consumer. a floor above a consumer's makes the package unusable there
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "ui-base",
]

# TORCH IS OPTIONAL, deliberately. the loop itself does not need it - only the vision backend does,
# and a consumer doing tabular work should not be made to install 2 GB of cuda wheels to use the
# judging half. `detect/model.py` imports torch lazily inside `_torch()` for exactly this reason.
[project.optional-dependencies]
vision = ["torch>=2.0"]
# core ml on apple silicon: the "coreml" runtime of smolsmort.detect.train.load; needs torch too.
# coremltools 9.0 has wheels for 3.11-3.13 only - on 3.14 it installs as a pure-python shell with
# no native libraries, so the marker leaves it out there and the runtime says so by name
coreml = ["torch>=2.0", "coremltools>=8; python_version < '3.14'"]
# xgboost was a base dependency, but nothing in the detect/vision path needs it - only
# tabular/backend.py, resolved lazily through backends.py's string registry. as a base
# dependency it made coremltools's own xgboost import unconditional too, and xgboost's
# libxgboost.dylib links homebrew's libomp, which segfaults against torch's bundled libomp
# in any process that also uses the coreml runtime. a vision-only consumer should never pay for it.
tabular = ["xgboost>=3.2.0"]

[project.scripts]
smolsmort = "smolsmort.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smolsmort"]

[tool.ruff]
line-length = 100
target-version = "py311"

# THE SAME SELECTION AS THE CONSUMER IT WAS EXTRACTED FROM, deliberately. The code moved across
# verbatim; a different rule set here would flag lines that are fine upstream, and "fixing" them
# would create drift between two copies of the same file for no reason but a config difference.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (common bug patterns)
    "C4",   # flake8-comprehensions (simplify list/dict/set comprehensions)
    "SIM",  # flake8-simplify (simplify boolean logic)
]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "B008",   # function calls in default args
    "SIM108", # ternary — full if/else is often clearer
    "UP007",  # x | y union syntax — keep optional[] for readability
]

[tool.ruff.lint.isort]
known-first-party = ["smolsmort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.uv.sources]
# smortui v0.2.3: dirMenu, range-slider, stepper, the arrangement recipes and the review page fixes
ui-base = { git = "https://github.com/BalthazarFitzpatrick/smortui.git", tag = "v0.2.3" }

[dependency-groups]
dev = ["ruff>=0.11.0", "pytest>=8.0", "torch>=2.0"]
